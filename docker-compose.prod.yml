services:
  frontend:
    image: ghcr.io/skykuba/aui-frontend:latest
    container_name: frontend
    ports:
      - "8090:80"
    environment:
      - API_URL=http://gateway:8080/api
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    image: ghcr.io/skykuba/aui-gateway:latest
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - CLIENT_SERVICE_URL=http://accounts-office-client:8081
      - INVOICE_SERVICE_URL=http://accounts-office-invoice:8082
    depends_on:
      - accounts-office-client
      - accounts-office-invoice
    restart: unless-stopped

  accounts-office-client:
    image: ghcr.io/skykuba/aui-accounts-office-client:latest
    container_name: accounts-office-client
    environment:
      - SERVER_PORT=8081
      - INVOICE_SERVICE_URL=http://accounts-office-invoice:8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/client_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres
    restart: unless-stopped

  accounts-office-invoice:
    image: ghcr.io/skykuba/aui-accounts-office-invoice:latest
    container_name: accounts-office-invoice
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/invoice_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data:


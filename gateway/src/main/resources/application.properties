spring.application.name=gateway
server.port=8080

# Category Management Service
spring.cloud.gateway.server.webflux.routes[0].id=category-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clients/**

# Elements Management Service
spring.cloud.gateway.server.webflux.routes[1].id=elements-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/invoices/**

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG


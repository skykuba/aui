server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: client_route
          uri: http://localhost:8081
          predicates:
            - Path=/api/clients/**
          filters:
            - StripPrefix=1

        - id: invoice_route
          uri: http://localhost:8082
          predicates:
            - Path=/api/invoices/**
          filters:
            - StripPrefix=1